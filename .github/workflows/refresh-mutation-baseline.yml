name: Refresh mutation baseline

# One-shot workflow for branches that touch enough files to invalidate the
# whole stryker baseline (e.g. a biome major bump that reformats everything).
# Local pre-push can be bypassed with MUTATION_GATE_BIOME_BUMP=1 for those
# pushes; this workflow then runs the gate in CI (multi-hour timeout, single
# worker, more memory than the contributor's laptop) and commits the
# refreshed `tooling/stryker/baseline-scores.json` back to the branch.
#
# After the commit lands, subsequent pushes hash-skip every file → mutation
# gate passes locally and the PR is mergeable.
#
# Trigger by:
#   - workflow_dispatch on the branch you want refreshed.
#   - or labeling the PR with `refresh-mutation-baseline`.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch ref to refresh baseline on"
        required: true
        type: string
  pull_request:
    types: [labeled]
  push:
    # Once the workflow file lands on a branch, that push triggers it
    # (GitHub reads the workflow from the head of the push). Run on
    # branches that explicitly opt in via the prefix.
    branches:
      - "chore/biome-*-bump"
      - "chore/refresh-mutation-baseline-*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Serialize: a second run on the same branch would race on the commit/push.
concurrency:
  group: refresh-mutation-baseline-${{ github.event.pull_request.head.ref || inputs.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: |
      github.event_name == 'workflow_dispatch'
      || github.event_name == 'push'
      || (github.event_name == 'pull_request' && github.event.label.name == 'refresh-mutation-baseline')
    name: Refresh stryker baseline
    runs-on: ubuntu-latest
    # Up to GitHub Actions' max (6h on most plans). A 6h cap was hit at
    # single-worker concurrency on a 227-file sweep, so this version uses
    # default parallelism (4) and explicitly accepts that the workflow may
    # be split across multiple runs (the gate's checkpoint reporter
    # persists progress per mutant, so a re-run picks up where the
    # previous one stopped).
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      TARGET_REF: ${{ github.event.pull_request.head.ref || inputs.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_REF }}
          # Need full history for the gate's `git diff origin/main...HEAD`.
          fetch-depth: 0
          # Use a token that can push back to the branch.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24.8"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - run: bun install --frozen-lockfile

      - name: Build astropress (mutation tests load from dist/)
        run: bun run --filter @astropress-diy/astropress build

      - name: Refresh mutation baseline
        # The gate writes the new baseline on a passing run. STRYKER_CONCURRENCY
        # defaults to 4; raising it more on a 4-CPU runner produces diminishing
        # returns and risks OOM. The gate's checkpoint reporter persists
        # per-mutant progress so a SIGKILLed worker doesn't lose the work.
        env:
          STRYKER_CONCURRENCY: "4"
        run: bun run tooling/scripts/prepush-mutation-gate.ts

      - name: Commit refreshed baseline
        run: |
          if git diff --quiet tooling/stryker/baseline-scores.json; then
            echo "Baseline unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tooling/stryker/baseline-scores.json
          git commit -m "chore(stryker): refresh baseline after formatter sweep

          Computed by .github/workflows/refresh-mutation-baseline.yml on
          a single-worker stryker run. Commit lets subsequent pushes
          hash-skip the gate and land normally."
          git push origin HEAD:"$TARGET_REF"
