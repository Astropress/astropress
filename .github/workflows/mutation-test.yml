name: Mutation Testing

on:
  push:
    # Refresh the shared `.stryker-incremental.json` after every merge to
    # main. Mondays-only used to leave the cache stale for up to 6 days
    # after a large refactor; running per-merge keeps it ≤ one diff stale,
    # which is always a cheap incremental update.
    branches: [main]
    paths:
      - "packages/astropress/src/**"
      - "packages/astropress/tests/**"
      - "tooling/stryker/**"
      - ".github/workflows/mutation-test.yml"
  schedule:
    - cron: "0 6 * * 1" # Monday 6am UTC — safety net if main has been quiet
  workflow_dispatch:
    inputs:
      scope:
        description: "Scope: full (all source) or critical (security paths only)"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - critical

# Serialize runs that touch the `stryker-state` branch — concurrent runs
# would race on the lock and one would fail to acquire. Queue rather than
# cancel so we never skip refreshing the cache after a merge.
concurrency:
  group: stryker-state
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  baseline-audits:
    name: Baseline audits (TypeScript + Rust)
    # Quality gate. Runs the per-file baseline checks that the pre-push
    # hook also runs locally — same authority on main as on PRs:
    #   * audit:baseline-coverage  — every src file has a baseline entry
    #   * audit:baseline-floor     — no entry drops vs HEAD~1
    #   * mutation-gate --check-only — files changed since HEAD~1 still
    #     match their recorded score within tolerance.
    # Runs in parallel with the Stryker cache refresh (which is allowed
    # to "fail" the historical 95% global threshold without blocking
    # main).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24.8"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - run: bun install --frozen-lockfile
      - run: bun run audit:baseline-coverage
      - run: bun run audit:baseline-floor
      - run: bun run audit:baseline-coverage:rust
      - run: bun run audit:baseline-floor:rust
      - run: bun run tooling/scripts/prepush-mutation-gate.ts --check-only

  stryker:
    name: Stryker (TypeScript, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Cache-refresh-only — `baseline-audits` is the real quality gate and
    # finishes in 30s in parallel. continue-on-error keeps a long Stryker
    # run from showing up as a red workflow when the cache simply needs
    # more time on a cold start.
    continue-on-error: true
    # Cold full-suite (unsharded) historically ran ~4h11m. Splitting into
    # two alphabetic shards drops the wall to ~2h15m each; the ceiling
    # below covers drift + extended-coverage from new source files.
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        # Each shard mutates a roughly-equal half of src/ (a–m, n–z) with
        # its own incremental cache file on the `stryker-state` branch.
        # Lock contention is avoided because each shard uses lock-<shard>.json.
        shard: [a, b]
    permissions:
      # `run-mutants-shared` reads from and pushes to the `stryker-state`
      # branch via the git refs API; the default GITHUB_TOKEN needs explicit
      # contents:write to update refs.
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24.8"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - run: bun install --frozen-lockfile

      - name: Run Stryker (full suite, shared cache, shard ${{ matrix.shard }})
        if: inputs.scope != 'critical'
        # Pulls latest `.stryker-incremental-<shard>.json` from the
        # `stryker-state` branch, runs Stryker on the shard's mutate
        # subset, pushes the refreshed cache back. Critical-paths-only
        # runs are unsharded (the suite is small enough) and only execute
        # on shard=a to avoid duplicating the same run.
        run: bun run tooling/scripts/run-mutants-shared.ts run --shard ${{ matrix.shard }}

      - name: Run Stryker (critical paths only)
        if: inputs.scope == 'critical' && matrix.shard == 'a'
        run: npx stryker run ../../tooling/stryker/stryker-critical.config.mjs
        working-directory: packages/astropress

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stryker-report-${{ matrix.shard }}
          path: reports/mutation/

  cargo-mutants:
    name: cargo-mutants (Rust, refresh)
    # Refresh-only: runs the full crate, uploads outcomes.json as an
    # artifact, and does NOT fail on missed mutants. Quality enforcement
    # happens in baseline-audits (audit:baseline-floor:rust +
    # audit:baseline-coverage:rust + prepush-mutation-gate-rust on
    # changed files), mirroring the TS split.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24.8"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      # 27 Rust tests under tests::scaffold / tests::doctor depend on
      # packages/astropress being built (find_astropress_src looks for
      # packages/astropress/dist/src/). Without this build, cargo test
      # exits red in the unmutated baseline and cargo-mutants refuses
      # to test any mutants.
      - run: bun install --frozen-lockfile
      - run: bun run --filter @astropress-diy/astropress build

      - run: cargo install cargo-mutants --locked

      # --in-place: cargo-mutants's default tmp-copy excludes gitignored
      # files, including packages/astropress/dist. 27 tests under
      # tests::scaffold/doctor depend on that dist (find_astropress_src),
      # so the unmutated baseline fails in a copy. Ephemeral CI runners
      # tolerate in-place mutation safely; locally devs use --in-place
      # too for the same reason.
      - name: Run cargo-mutants (full crate, refresh-only)
        run: cargo mutants --package astropress-cli --timeout 60 --in-place || true
        working-directory: crates

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cargo-mutants-report
          path: crates/mutants.out/
